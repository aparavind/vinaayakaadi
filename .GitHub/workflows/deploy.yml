name: Build and Deploy Static HTML

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Markdown into HTML Template
        run: |
          # 1. Read the markdown content and escape characters that might break sed
          # 2. Use 'sed' to replace the placeholder with the content of vinaayakaadi.md
          # This specific 'sed' command reads from vinaayakaadi.md and inserts it 
          # where it finds the __ORIGINAL_MD_CONTENT__ keyword.
          
          sed -e '/__ORIGINAL_MD_CONTENT__/{r vinaayakaadi.md' -e 'd}' vinaayakaadi.html > index.html

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Upload the folder containing your new index.html

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
