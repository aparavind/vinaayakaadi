<script>
document.addEventListener("DOMContentLoaded", () => {
  const contentEl = document.getElementById("content");
  
  // Fetch and render Markdown
  fetch("vinaayakaadi.md")
    .then(r => r.text())
    .then(md => {
      const converter = new showdown.Converter();
      contentEl.innerHTML = converter.makeHtml(md);
      
      // Load Aksharamukha
      const script = document.createElement('script');
      script.src = "https://cdn.jsdelivr.net/gh/virtualvinodh/aksharamukha/aksharamukha-web-plugin/aksharamukha-v3.js";
      
      script.onload = function() {
        // Check repeatedly for Aksharamukha to be available
        const checkInterval = setInterval(() => {
          if (window.Aksharamukha && typeof window.Aksharamukha.init === 'function') {
            clearInterval(checkInterval);
            window.Aksharamukha.init();
            console.log('Aksharamukha initialized successfully');
          }
        }, 100);
        
        // Stop checking after 5 seconds
        setTimeout(() => clearInterval(checkInterval), 5000);
      };
      
      document.head.appendChild(script);
    })
    .catch(err => {
      console.error('Error:', err);
      contentEl.textContent = "Failed to load content.";
    });
});
</script>
