<script src="https://cdn.jsdelivr.net/gh/virtualvinodh/aksharamukha/aksharamukha-web-plugin/aksharamukha-v3.js"></script>
<script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>

<div id="showtext"></div>

<script>
  var converter = new showdown.Converter();

  fetch("vinaayakaadi.md")
    .then(response => {
      if (!response.ok) {
        throw new Error("Failed to load MD file");
      }
      return response.text();
    })
    .then(mdText => {
      var html = converter.makeHtml(mdText);
      $("#showtext").html(html);
    })
    .catch(err => {
      console.error(err);
      $("#showtext").html("<p>Error loading markdown file.</p>");
    });
</script>
