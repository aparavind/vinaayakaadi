<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanskrit Markdown Reader</title>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>

  <style>
    body {
      font-family: serif;
      line-height: 1.6;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- Markdown output -->
  <div id="content" class="aksharamukha-text"></div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const contentEl = document.getElementById("content");

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    // 1️⃣ Fetch & render Markdown FIRST
    fetch("vinaayakaadi.md")
      .then(r => r.text())
      .then(md => {
        const converter = new showdown.Converter();
        contentEl.innerHTML = converter.makeHtml(md);

        // 2️⃣ Load Aksharamukha ONLY AFTER content exists
        return loadScript(
          "https://cdn.jsdelivr.net/gh/virtualvinodh/aksharamukha/aksharamukha-web-plugin/aksharamukha-v3.js"
        );
      })
      .then(() => {
        // 3️⃣ Initialize Aksharamukha UI
        if (window.Aksharamukha) {
          Aksharamukha.init();
        }
      })
      .catch(err => {
        console.error(err);
        contentEl.textContent = "Failed to load content.";
      });

  });
  </script>

</body>
</html>
