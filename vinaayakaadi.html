<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanskrit Reader</title>

  <script src="https://cdn.jsdelivr.net/gh/virtualvinodh/aksharamukha/aksharamukha-web-plugin/aksharamukha-v3.js"></script>

  <style>
    body { font-family: serif; line-height: 1.6; padding: 20px; }
    select { font-size: 16px; margin-bottom: 15px; }
    pre { white-space: pre-wrap; }
  </style>
</head>

<body>

  <label>
    Select Script:
    <select id="script">
      <option value="Devanagari">Devanagari</option>
      <option value="IAST">IAST</option>
      <option value="Tamil">Tamil</option>
      <option value="Kannada">Kannada</option>
      <option value="Telugu">Telugu</option>
      <option value="Malayalam">Malayalam</option>
    </select>
  </label>

  <pre id="content"></pre>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const contentEl = document.getElementById("content");
      const scriptSelect = document.getElementById("script");

      let originalText = "";

      fetch("vinaayakaadi.md")
        .then(r => r.text())
        .then(text => {
          originalText = text;
          convert();
        });

      function convert() {
        if (!window.Aksharamukha) return;

        const target = scriptSelect.value;

        contentEl.textContent =
          target === "Devanagari"
            ? originalText
            : Aksharamukha.convert(
                "Devanagari",
                target,
                originalText
              );
      }

      scriptSelect.addEventListener("change", convert);

    });
  </script>

</body>
</html>
