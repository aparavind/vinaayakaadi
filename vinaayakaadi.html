<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanskrit Markdown Reader</title>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>

  <style>
    body {
      font-family: serif;
      line-height: 1.6;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- Markdown output -->
  <div id="content" class="aksharamukha-text"></div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const contentEl = document.getElementById("content");

    // Function to initialize Aksharamukha with retry logic
    function initAksharamukha(retryCount = 0, maxRetries = 5) {
      if (window.Aksharamukha) {
        console.log('Aksharamukha loaded, initializing...');
        return true;
      } else {
        if (retryCount < maxRetries) {
          console.log(`Aksharamukha not available yet, retrying... (${retryCount + 1}/${maxRetries})`);
          setTimeout(() => initAksharamukha(retryCount + 1, maxRetries), 500);
          return false;
        } else {
          console.error('Failed to load Aksharamukha after multiple attempts');
          return false;
        }
      }
    }

    // Alternative: Use a MutationObserver to detect when the script loads
    function waitForAksharamukha() {
      return new Promise((resolve) => {
        if (window.Aksharamukha) {
          resolve();
          return;
        }
        
        // Create a custom event to signal when Aksharamukha is ready
        const observer = new MutationObserver(() => {
          if (window.Aksharamukha) {
            observer.disconnect();
            resolve();
          }
        });
        
        observer.observe(window, {
          attributes: true,
          childList: false,
          subtree: false
        });
        
        // Fallback timeout
        setTimeout(() => {
          if (window.Aksharamukha) {
            resolve();
          } else {
            console.warn('Aksharamukha not loaded after timeout');
            resolve(); // Still resolve to continue
          }
        }, 3000);
      });
    }

    // Main loading logic
    fetch("vinaayakaadi.md")
      .then(r => {
        if (!r.ok) {
          throw new Error(`HTTP error! status: ${r.status}`);
        }
        return r.text();
      })
      .then(md => {
        const converter = new showdown.Converter();
        contentEl.innerHTML = converter.makeHtml(md);

        // Create script element for Aksharamukha
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/aksharamukha@latest/dist/index.global.js";
        script.onload = () => {
          console.log('Aksharamukha script loaded');
          // Wait for the library to be fully initialized
          waitForAksharamukha().then(() => {
            if (window.Aksharamukha && typeof window.Aksharamukha.init === 'function') {
              console.log('Initializing Aksharamukha UI');
            } else {
              console.error('Aksharamukha.init is not a function or Aksharamukha not defined');
              // Try the retry method as fallback
              initAksharamukha();
            }
          });
        };
        script.onerror = (err) => {
          console.error('Failed to load Aksharamukha script:', err);
          contentEl.innerHTML += '<p style="color: red">Note: Script loading failed</p>';
        };
        
        document.head.appendChild(script);
      })
      .catch(err => {
        console.error('Error loading content:', err);
        contentEl.textContent = "Failed to load content: " + err.message;
      });

  });
  </script>

</body>
</html>
