<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanskrit Markdown Reader</title>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/virtualvinodh/aksharamukha/aksharamukha-web-plugin/aksharamukha-v3.js"></script>

  <style>
    body {
      font-family: serif;
      line-height: 1.6;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- Markdown output -->
  <div id="content" class="aksharamukha-text"></div>

  <div id="original" style="visibility: hidden">
__ORIGINAL_MD_CONTENT__
  </div>
  
  <script>
    const contentEl = document.getElementById("content");
    const converter = new showdown.Converter();
    contentEl.innerHTML = converter.makeHtml(document.getElementById("original").textContent);
  </script>

</body>
</html>
