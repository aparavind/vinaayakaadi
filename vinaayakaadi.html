<script src="https://cdn.jsdelivr.net/gh/virtualvinodh/aksharamukha/aksharamukha-web-plugin/aksharamukha-v3.js"></script>
<script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>

<div id="showtext" class="aksharamukha-text"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const converter = new showdown.Converter();

  fetch("vinaayakaadi.md")
    .then(r => r.text())
    .then(md => {

      // 1. Markdown → HTML
      document.getElementById("showtext").innerHTML =
        converter.makeHtml(md);

      // 2. 🔥 Re-initialize Aksharamukha UI
      if (window.Aksharamukha) {
        Aksharamukha.init();
      }

    });

});
</script>
