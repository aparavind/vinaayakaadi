name: Build and Deploy Static HTML

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Markdown into HTML Template
        run: |
          set -e
          mkdir -p _site
          # Use Python for reliable substitution (works on all runners; sed varies by OS)
          python3 << 'PY'
          placeholder = "__ORIGINAL_MD_CONTENT__"
          with open("vinaayakaadi.html", "r") as f:
            html = f.read()
          with open("vinaayakaadi.md", "r") as f:
            md = f.read()
          if placeholder not in html:
            raise SystemExit(f"Placeholder {placeholder!r} not found in template")
          out = html.replace(placeholder, md)
          with open("_site/vinayka_pooja.html", "w") as f:
            f.write(out)
          PY
          test -f _site/vinayka_pooja.html && test -s _site/vinayka_pooja.html
          cp _site/vinayka_pooja.html _site/index.html

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
